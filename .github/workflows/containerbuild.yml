name: Buildah build
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "33 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bengt-debug
            containerfile: ./Containerfile
          - image: bengt-debug-fed
            containerfile: ./Containerfile.fedora
    env:
      IMAGE_NAME: ${{ matrix.image }}
      IMAGE_TAG: latest
      GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
      CR_IMAGE_NAME: r/${{ matrix.image }}
      CR_REGISTRY: cr.fredhs.net
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Buildah Action
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG }}
          platforms: linux/amd64, linux/arm64
          containerfiles: |
            ${{ matrix.containerfile }}

      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ env.IMAGE_TAG }}
          registry: ${{ env.GHCR_REGISTRY }}

      - name: Tag image for cr.fredhs.net
        run: buildah tag ${{ steps.build-image.outputs.image }}:${{ env.IMAGE_TAG }} ${{ env.CR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Log in to cr.fredhs.net
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.CR_REGISTRY }}
          username: ${{ secrets.CR_FREDHS_NET_USR }}
          password: ${{ secrets.CR_FREDHS_NET_PWD }}

      - name: Push to cr.fredhs.net registry
        id: push-to-crfredhs
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ env.CR_IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG }}
          registry: ${{ env.CR_REGISTRY }}
